# --- Performance ---
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.configuration-cache=true

# --- AndroidX ---
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# --- Kotlin ---
kotlin.code.style=official
kotlin.incremental=true
# 4096m started failing with "Back-end (JVM) Internal error: Couldn't transform
# method node" / OutOfMemoryError in the ASM frame analyzer as the Compose
# surface area grew. The composable it dies on is not itself large (52 lines) —
# the pressure is cumulative across the module, so this is a heap bump rather
# than a code split. -Xss16m keeps the deeply-nested Compose trees off the
# stack-overflow path at the same time.
kotlin.daemon.jvmargs=-Xmx6144m -Xss16m -XX:+UseParallelGC -Dfile.encoding=UTF-8
ksp.incremental=true
